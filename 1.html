<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复制链接</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .card {
            background: #ffffff;
            padding: 40px 48px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 520px;
            width: 90%;
        }

        .card h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1e2a3a;
            margin-bottom: 12px;
        }

        .card .desc {
            font-size: 14px;
            color: #6b7a8f;
            margin-bottom: 28px;
            word-break: break-all;
        }

        .link-box {
            background: #f7f9fc;
            border: 1px solid #e6edf4;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 24px;
            font-size: 14px;
            color: #1e2a3a;
            word-break: break-all;
            text-align: left;
            font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
            letter-spacing: 0.2px;
            line-height: 1.6;
        }

        .btn-copy {
            background: #4a6cf7;
            color: #ffffff;
            border: none;
            border-radius: 40px;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.3);
        }

        .btn-copy:hover {
            background: #3b5de7;
        }

        .btn-copy:active {
            transform: scale(0.96);
        }

        .btn-copy:focus-visible {
            outline: 2px solid #4a6cf7;
            outline-offset: 2px;
        }

        .toast {
            margin-top: 16px;
            font-size: 14px;
            color: #2e7d32;
            opacity: 0;
            transition: opacity 0.25s ease;
            height: 22px;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>📋 复制链接</h2>
        <p class="desc">点击下方按钮复制完整链接</p>

        <!-- 这里放你要复制的链接 -->
        <div class="link-box" id="linkDisplay">
            https://pan.baidu.com/s/1xv12SIs8AuUYrO2TEb_y6g?pwd=c1cu
        </div>

        <button class="btn-copy" id="copyBtn">复制链接</button>
        <div class="toast" id="toast">✅ 已复制到剪贴板</div>
    </div>

    <script>
        (function() {
            const copyBtn = document.getElementById('copyBtn');
            const toast = document.getElementById('toast');
            // 要复制的目标链接（与显示一致）
            const link = 'https://pan.baidu.com/s/1xv12SIs8AuUYrO2TEb_y6g?pwd=c1cu';

            // 显示提示消息（短暂出现后自动消失）
            function showToast(message) {
                toast.textContent = message || '✅ 已复制到剪贴板';
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }

            // 复制核心逻辑
            async function handleCopy() {
                try {
                    // 优先使用 Clipboard API (现代浏览器)
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(link);
                        showToast('✅ 已复制到剪贴板');
                        return;
                    }

                    // 降级方案：使用 document.execCommand('copy')
                    // 创建一个临时文本区域
                    const textArea = document.createElement('textarea');
                    textArea.value = link;
                    // 避免页面滚动或选中内容被干扰
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-9999px';
                    textArea.style.top = '-9999px';
                    textArea.style.width = '1px';
                    textArea.style.height = '1px';
                    textArea.style.opacity = '0';
                    document.body.appendChild(textArea);

                    // 选中并复制
                    textArea.select();
                    textArea.setSelectionRange(0, textArea.value.length);

                    const success = document.execCommand('copy');
                    document.body.removeChild(textArea);

                    if (success) {
                        showToast('✅ 已复制到剪贴板');
                    } else {
                        showToast('❌ 复制失败，请手动复制');
                    }
                } catch (err) {
                    console.warn('复制出错:', err);
                    showToast('❌ 复制失败，请手动复制');
                }
            }

            copyBtn.addEventListener('click', handleCopy);
        })();
    </script>

</body>
</html>
