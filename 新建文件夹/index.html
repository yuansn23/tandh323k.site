<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Loading</title>
<style>
  :root{
    --bg:#ffffff;
    --gold:#e8b64c;
    --gold-2:#f6d489;
    --gold-deep:#c8902f;
    --gold-text:#b8860b;
    --text:#1a1a1e;
    --muted:#7a7a84;
    --card-border:rgba(0,0,0,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ============================================================
     加载页（20 秒后自动进入，圆圈显示百分比）
     ============================================================ */
  #loader{
    position:fixed;inset:0;z-index:1000;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(700px 500px at 50% 42%, rgba(232,182,76,.08), transparent 65%),
      var(--bg);
    transition:opacity .6s ease, visibility .6s ease;
  }
  #loader.is-leaving{opacity:0;visibility:hidden;pointer-events:none;}
  .loader-inner{display:flex;flex-direction:column;align-items:center;gap:26px;}
  .loader-brand{
    font-size:48px;font-weight:700;letter-spacing:8px;
    background:linear-gradient(180deg,#1a1a1e 20%,var(--gold-text) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* 圆圈百分比 */
  .boot-ring{width:120px;height:120px;position:relative;}
  .boot-ring svg{width:100%;height:100%;position:absolute;inset:0;}
  .boot-num{
    position:absolute;inset:0;z-index:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1;
  }
  .boot-num b{
    font-size:36px;font-weight:700;color:var(--text);display:block;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .boot-num span{font-size:13px;color:var(--gold-text);display:block;margin-top:4px;letter-spacing:1px;}

  .loader-text{color:var(--text);font-size:18px;letter-spacing:1px;}
  .dots i{font-style:normal;animation:dot-blink 1.4s infinite;}
  .dots i:nth-child(2){animation-delay:.2s;}
  .dots i:nth-child(3){animation-delay:.4s;}
  @keyframes dot-blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

  /* ============================================================
     弹窗：USDT付款请联系财务
     ============================================================ */
  .mask{
    position:fixed;inset:0;z-index:2000;
    background:rgba(0,0,0,.22);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .mask.show{display:flex;}
  .dialog{
    width:100%;max-width:340px;
    background:#ffffff;
    border:1px solid rgba(0,0,0,.10);
    border-radius:18px;
    padding:32px 26px 24px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.28),0 0 40px -10px rgba(232,182,76,.30);
    animation:dialog-pop .35s cubic-bezier(.16,1,.3,1);
  }
  @keyframes dialog-pop{from{transform:translateY(20px) scale(.96);opacity:0;}to{transform:none;opacity:1;}}
  .dialog-icon{
    width:64px;height:64px;margin:0 auto 18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--gold-2),var(--gold-deep));
    color:#241803;font-size:30px;font-weight:800;
    box-shadow:0 0 0 6px rgba(232,182,76,.18),0 12px 30px -8px rgba(232,182,76,.45);
  }
  .dialog h3{
    font-size:22px;font-weight:800;letter-spacing:2px;
    background:linear-gradient(180deg,#1a1a1e 20%,var(--gold-text) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .dialog p{margin-top:10px;font-size:15px;color:var(--muted);letter-spacing:1px;}
  .dialog .confirm{
    margin-top:24px;width:100%;border:none;cursor:pointer;
    padding:13px;border-radius:12px;
    background:linear-gradient(135deg,var(--gold-2),var(--gold-deep));
    color:#241803;font-size:16px;font-weight:700;letter-spacing:3px;
    transition:transform .2s ease,box-shadow .2s ease;
    font-family:inherit;
  }
  .dialog .confirm:hover{transform:translateY(-1px);box-shadow:0 12px 24px -8px rgba(232,182,76,.6);}
  .dialog .confirm:active{transform:scale(.97);}

  @media (max-width:600px){
    .loader-brand{font-size:38px;letter-spacing:5px;}
  }
</style>
</head>
<body>

  <!-- ===================== 加载页 ===================== -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-brand"></div>
      <div class="boot-ring">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="5"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke="url(#bootGrad)" stroke-width="5"
                  stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="326.73" id="bootCircle"
                  transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 6px rgba(232,182,76,.35));"/>
          <defs>
            <linearGradient id="bootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f6d489"/>
              <stop offset="100%" stop-color="#c8902f"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="boot-num"><b id="bnum">0</b><span>%</span></div>
      </div>
      <div class="loader-text">加载中<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    </div>
  </div>

  <!-- ===================== 弹窗 ===================== -->
  <div class="mask" id="modal">
    <div class="dialog">
      <div class="dialog-icon">₮</div>
      <h3>USDT付款</h3>
      <p>请联系财务</p>
      <button class="confirm" id="modalOk">知道了</button>
    </div>
  </div>

<script>
(function () {
  var LOAD_MS = 20000; // 20 秒

  var bn     = document.getElementById('bnum');
  var circle = document.getElementById('bootCircle');
  var loader = document.getElementById('loader');
  var modal  = document.getElementById('modal');
  var LEN    = 326.73; // 2 * π * 52

  // 圆圈百分比：0 → 100%，共 20 秒
  var p = 0;
  var step = LOAD_MS / 100; // 每 1% 用时
  var timer = setInterval(function () {
    p++;
    circle.style.strokeDashoffset = LEN * (1 - p / 100);
    bn.textContent = p;
    if (p >= 100) {
      clearInterval(timer);
      finish();
    }
  }, step);

  function finish() {
    // 加载完成 → 淡出加载页
    loader.classList.add('is-leaving');
    setTimeout(function () { if (loader && loader.parentNode) loader.parentNode.removeChild(loader); }, 600);
    // 弹出「USDT付款请联系财务」
    modal.classList.add('show');
  }

  document.getElementById('modalOk').onclick = function () {
    modal.classList.remove('show');
  };
})();
</script>
</body>
</html>
